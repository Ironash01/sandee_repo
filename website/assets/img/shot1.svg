<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225" role="img" aria-label="Screenshot: mining ore in a cave">
  <rect width="400" height="225" fill="#0d1226"/>
  <!-- cave wall tiles -->
  <g fill="#2b3252">
    <rect x="0" y="0" width="400" height="225"/>
  </g>
  <g fill="#3a4160">
    <rect x="20" y="18" width="44" height="34"/><rect x="80" y="10" width="40" height="30"/>
    <rect x="140" y="22" width="46" height="32"/><rect x="220" y="12" width="42" height="30"/>
    <rect x="288" y="20" width="46" height="34"/><rect x="348" y="14" width="40" height="28"/>
    <rect x="16" y="70" width="46" height="34"/><rect x="96" y="66" width="42" height="30"/>
    <rect x="170" y="74" width="44" height="32"/><rect x="250" y="68" width="46" height="34"/>
    <rect x="330" y="72" width="42" height="30"/>
  </g>
  <g fill="#4b5480">
    <rect x="24" y="22" width="12" height="10"/><rect x="148" y="26" width="12" height="10"/>
    <rect x="292" y="24" width="12" height="10"/><rect x="100" y="70" width="12" height="10"/>
    <rect x="254" y="72" width="12" height="10"/>
  </g>
  <!-- ground -->
  <rect x="0" y="150" width="400" height="75" fill="#232945"/>
  <rect x="0" y="150" width="400" height="8" fill="#333c66"/>
  <!-- ore veins -->
  <g>
    <rect x="86" y="176" width="14" height="14" fill="#d9d9d9" stroke="#05070f" stroke-width="2"/>
    <rect x="150" y="192" width="14" height="14" fill="#63c8f0" stroke="#05070f" stroke-width="2"/>
    <rect x="300" y="184" width="14" height="14" fill="#63c8f0" stroke="#05070f" stroke-width="2"/>
    <rect x="336" y="200" width="12" height="12" fill="#ffcc66" stroke="#05070f" stroke-width="2"/>
  </g>
  <!-- torch -->
  <g>
    <rect x="230" y="120" width="6" height="34" fill="#6a4a2b"/>
    <rect x="226" y="108" width="14" height="14" fill="#ff7a2f"/>
    <rect x="230" y="102" width="6" height="10" fill="#ffcc66"/>
  </g>
  <rect x="196" y="96" width="74" height="60" fill="#ffcc66" opacity="0.10"/>
  <!-- player with pickaxe -->
  <g>
    <rect x="292" y="132" width="16" height="16" fill="#f2c89a" stroke="#05070f" stroke-width="2"/>
    <rect x="290" y="128" width="20" height="7" fill="#6a4a2b"/>
    <rect x="290" y="148" width="20" height="24" fill="#478cbf" stroke="#05070f" stroke-width="2"/>
    <rect x="290" y="172" width="8" height="10" fill="#3a4a7a"/>
    <rect x="302" y="172" width="8" height="10" fill="#3a4a7a"/>
    <!-- pickaxe -->
    <rect x="312" y="140" width="6" height="24" fill="#8a5a2b"/>
    <rect x="306" y="136" width="20" height="6" fill="#c9d2e6"/>
    <rect x="322" y="132" width="6" height="6" fill="#c9d2e6"/>
  </g>
</svg>
