<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="SandEE key art: a pixel-art open world with a player and a coding robot">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223a6e"/>
      <stop offset="1" stop-color="#4a7fb5"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- sun -->
  <g fill="#ffcc66">
    <rect x="108" y="52" width="36" height="36"/>
    <rect x="100" y="60" width="52" height="20"/>
    <rect x="116" y="44" width="20" height="52"/>
  </g>

  <!-- clouds -->
  <g fill="#dfe9ff" opacity="0.9">
    <rect x="392" y="66" width="72" height="16"/>
    <rect x="408" y="52" width="40" height="16"/>
    <rect x="360" y="82" width="120" height="14"/>
    <rect x="150" y="110" width="54" height="14"/>
    <rect x="166" y="98" width="30" height="14"/>
  </g>

  <!-- far mountains -->
  <polygon points="0,252 90,150 170,252" fill="#2b3f6b"/>
  <polygon points="130,252 250,120 380,252" fill="#334a7d"/>
  <polygon points="340,252 470,150 600,252" fill="#2b3f6b"/>
  <polygon points="520,252 620,168 640,180 640,252" fill="#334a7d"/>
  <!-- snow caps -->
  <g fill="#cfe0ff">
    <rect x="240" y="132" width="20" height="8"/>
    <rect x="230" y="140" width="40" height="8"/>
  </g>

  <!-- ground -->
  <rect x="0" y="252" width="640" height="108" fill="#7a5a34"/>
  <rect x="0" y="252" width="640" height="22" fill="#4fae5e"/>
  <rect x="0" y="252" width="640" height="6" fill="#8ce69a"/>
  <g fill="#3f8a4c">
    <rect x="40" y="268" width="24" height="6"/>
    <rect x="300" y="268" width="30" height="6"/>
    <rect x="520" y="268" width="26" height="6"/>
  </g>
  <g fill="#c9a86a">
    <rect x="70" y="296" width="18" height="10"/>
    <rect x="250" y="312" width="22" height="10"/>
    <rect x="430" y="300" width="16" height="10"/>
    <rect x="560" y="324" width="20" height="10"/>
  </g>

  <!-- pond -->
  <rect x="70" y="286" width="86" height="18" fill="#3a86c9"/>
  <rect x="70" y="286" width="86" height="6" fill="#63c8f0"/>

  <!-- tree left -->
  <rect x="120" y="196" width="14" height="60" fill="#8a5a2b"/>
  <rect x="96" y="168" width="62" height="18" fill="#4fae5e"/>
  <rect x="86" y="186" width="82" height="20" fill="#4fae5e"/>
  <rect x="96" y="206" width="62" height="14" fill="#3f8a4c"/>
  <rect x="104" y="172" width="18" height="12" fill="#8ce69a"/>

  <!-- tree right -->
  <rect x="536" y="204" width="12" height="52" fill="#8a5a2b"/>
  <rect x="516" y="176" width="52" height="16" fill="#4fae5e"/>
  <rect x="508" y="192" width="68" height="18" fill="#4fae5e"/>
  <rect x="516" y="210" width="52" height="12" fill="#3f8a4c"/>
  <rect x="522" y="180" width="16" height="10" fill="#8ce69a"/>

  <!-- floating blocks (sand + wood) -->
  <g>
    <rect x="196" y="140" width="26" height="26" fill="#e6c98a" stroke="#05070f" stroke-width="2"/>
    <rect x="196" y="140" width="26" height="6" fill="#f2dda8"/>
    <rect x="430" y="120" width="24" height="24" fill="#9c6b3f" stroke="#05070f" stroke-width="2"/>
    <rect x="430" y="120" width="24" height="6" fill="#b58050"/>
  </g>

  <!-- player -->
  <g>
    <rect x="246" y="200" width="18" height="18" fill="#f2c89a" stroke="#05070f" stroke-width="2"/>
    <rect x="244" y="196" width="22" height="8" fill="#6a4a2b"/>
    <rect x="244" y="218" width="22" height="26" fill="#478cbf" stroke="#05070f" stroke-width="2"/>
    <rect x="244" y="244" width="8" height="10" fill="#3a4a7a"/>
    <rect x="258" y="244" width="8" height="10" fill="#3a4a7a"/>
    <rect x="242" y="222" width="6" height="16" fill="#f2c89a"/>
    <rect x="262" y="222" width="6" height="16" fill="#f2c89a"/>
  </g>

  <!-- coding robot -->
  <g>
    <rect x="356" y="190" width="4" height="10" fill="#0a0e1c"/>
    <rect x="354" y="184" width="8" height="6" fill="#ff5959"/>
    <rect x="348" y="198" width="30" height="20" fill="#63c8f0" stroke="#05070f" stroke-width="2"/>
    <rect x="354" y="204" width="18" height="8" fill="#0a0e1c"/>
    <rect x="356" y="206" width="4" height="4" fill="#ffcc66"/>
    <rect x="366" y="206" width="4" height="4" fill="#ffcc66"/>
    <rect x="348" y="218" width="30" height="22" fill="#478cbf" stroke="#05070f" stroke-width="2"/>
    <rect x="354" y="224" width="18" height="10" fill="#8ce69a"/>
    <rect x="350" y="240" width="10" height="12" fill="#2f3f6e"/>
    <rect x="366" y="240" width="10" height="12" fill="#2f3f6e"/>
  </g>

  <!-- floating code glyph above robot -->
  <g fill="#63c8f0">
    <rect x="392" y="176" width="4" height="4"/>
    <rect x="396" y="180" width="4" height="4"/>
    <rect x="392" y="184" width="4" height="4"/>
    <rect x="404" y="176" width="4" height="4"/>
    <rect x="400" y="180" width="4" height="4"/>
    <rect x="404" y="184" width="4" height="4"/>
  </g>
</svg>
