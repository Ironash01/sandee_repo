<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225" role="img" aria-label="Screenshot: a furnace automated with Python">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223a6e"/><stop offset="1" stop-color="#3f6ba0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#sky2)"/>
  <!-- ground -->
  <rect x="0" y="150" width="400" height="75" fill="#7a5a34"/>
  <rect x="0" y="150" width="400" height="16" fill="#4fae5e"/>
  <rect x="0" y="150" width="400" height="5" fill="#8ce69a"/>

  <!-- furnace -->
  <g>
    <rect x="60" y="86" width="76" height="64" fill="#5b5f70" stroke="#05070f" stroke-width="3"/>
    <rect x="60" y="86" width="76" height="10" fill="#767b90"/>
    <rect x="82" y="110" width="32" height="30" fill="#0a0e1c"/>
    <rect x="86" y="122" width="24" height="18" fill="#ff7a2f"/>
    <rect x="90" y="128" width="16" height="12" fill="#ffcc66"/>
  </g>

  <!-- crafting station -->
  <g>
    <rect x="168" y="100" width="64" height="50" fill="#9c6b3f" stroke="#05070f" stroke-width="3"/>
    <rect x="168" y="100" width="64" height="10" fill="#b58050"/>
    <rect x="176" y="118" width="20" height="10" fill="#478cbf"/>
    <rect x="204" y="118" width="20" height="10" fill="#8ce69a"/>
    <rect x="176" y="134" width="48" height="8" fill="#6a4a2b"/>
  </g>

  <!-- robot -->
  <g>
    <rect x="286" y="96" width="4" height="10" fill="#0a0e1c"/>
    <rect x="284" y="90" width="8" height="6" fill="#ff5959"/>
    <rect x="278" y="104" width="30" height="20" fill="#63c8f0" stroke="#05070f" stroke-width="2"/>
    <rect x="284" y="110" width="18" height="8" fill="#0a0e1c"/>
    <rect x="286" y="112" width="4" height="4" fill="#ffcc66"/>
    <rect x="296" y="112" width="4" height="4" fill="#ffcc66"/>
    <rect x="278" y="124" width="30" height="22" fill="#478cbf" stroke="#05070f" stroke-width="2"/>
    <rect x="284" y="130" width="18" height="10" fill="#8ce69a"/>
    <rect x="280" y="146" width="10" height="12" fill="#2f3f6e"/>
    <rect x="296" y="146" width="10" height="12" fill="#2f3f6e"/>
  </g>

  <!-- floating item blocks -->
  <g>
    <rect x="52" y="164" width="18" height="18" fill="#e6c98a" stroke="#05070f" stroke-width="2"/>
    <rect x="78" y="170" width="18" height="18" fill="#8a5a2b" stroke="#05070f" stroke-width="2"/>
    <rect x="104" y="164" width="18" height="18" fill="#3a4160" stroke="#05070f" stroke-width="2"/>
    <rect x="346" y="166" width="18" height="18" fill="#478cbf" stroke="#05070f" stroke-width="2"/>
  </g>

  <!-- python ribbon -->
  <rect x="250" y="16" width="130" height="26" fill="#141a33" stroke="#2f3f6e" stroke-width="3"/>
  <rect x="258" y="22" width="10" height="14" fill="#8ce69a"/>
  <rect x="272" y="22" width="10" height="14" fill="#ffcc66"/>
  <g fill="#63c8f0">
    <rect x="292" y="26" width="24" height="6"/>
    <rect x="322" y="26" width="14" height="6"/>
    <rect x="292" y="36" width="14" height="6"/>
    <rect x="312" y="36" width="24" height="6"/>
  </g>
