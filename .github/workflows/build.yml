name: "Build Interpreter"

on:
  push:
    branches:
      - interpreter2

jobs:
  build-artifacts:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - runs-on: windows-latest
            os: windows
          - runs-on: ubuntu-latest
            os: android
    runs-on: ${{ matrix.os.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (Windows)
        if: matrix.os.os == 'windows'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install Rust with Android Target
        if: matrix.os.os == 'android'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android

      - name: Install Android NDK
        if: matrix.os.os == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build artifact (Windows)
        if: matrix.os.os == 'windows'
        working-directory: SandEEAlpha/extension
        run: cargo build --release

      - name: Build artifact (Android)
        if: matrix.os.os == 'android'
        working-directory: SandEEAlpha/extension
        run: cargo build --release --target aarch64-linux-android

      - name: Store artifact (Windows)
        if: matrix.os.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os.os }}
          path: SandEEAlpha/ext_bin/release/interpreter.dll

      - name: Store artifact (Android)
        if: matrix.os.os = 'android'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os.os }}
          path: SandEEAlpha/ext_bin/aarch64-linux-android/release/libinterpreter.so

  upload:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    needs: [build-artifacts]
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - uses: action-pack/tag-exists@v1
        id: check-tag
        with:
          tag: builds

      - name: Create tag
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/builds',
              sha: context.sha
            })

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          make_latest: true
          files: |
            windows/interpreter.dll
            android/libinterpreter.so
          name: Interpreter Builds
          tag_name: builds
          body: Builds for the interpreter. Windows is `interpreter.dll` and Android is `libinterpreter.so`
          generate_release_notes: true
